name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 18 is the engine floor in package.json; 24 is current. magpie runs
        # plugins on Bun, so that is tested too — it is the runtime the tests
        # are least able to stand in for.
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  # The plugin runs on Bun inside magpie on every platform magpie ships, and
  # the tests reach for things Bun does not implement identically (mock
  # timers, symlinks, path handling). Linux alone does not show that.
  bun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun test

  # Windows is a first-class target (magpie ships a portable Windows build),
  # and the suite carries Windows-specific expectations — join() built paths,
  # an appdir under %LOCALAPPDATA%. Both runtimes, for the same reason.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: node --test

  # macOS-only code (the .app bundle's portable folder, ~/.local/bin, the
  # case-insensitive volume) was until now only ever exercised as injected
  # strings on ubuntu: nothing ran it on the platform it exists for.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: node --test

  # Three countdown tests used to read the clock twice — once for the fixture,
  # once for the expected value — and each read truncates to whole seconds, so
  # a second boundary in between made them red about once in a thousand runs.
  # The fix is to read it once, but nothing caught a regression: a test that
  # drifts back to two reads passes 999 runs out of 1000. tools/ticking-clock.mjs
  # advances the clock a second per read *from a test file*, so the old shape
  # fails every time.
  clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: node --import ./tools/ticking-clock.mjs --test
