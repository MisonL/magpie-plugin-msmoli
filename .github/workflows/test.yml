name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 18 is the engine floor in package.json; 24 is current. magpie runs
        # plugins on Bun, so that is tested too — it is the runtime the tests
        # are least able to stand in for.
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  # Windows is a first-class target (magpie ships a portable Windows build),
  # and the suite carries Windows-specific expectations — join() built paths,
  # a symlinked invocation, an appdir under %LOCALAPPDATA%. None of those
  # assertions were ever executed on Windows until this job existed.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test
