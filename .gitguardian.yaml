# GitGuardian runs on this repository as an integration and flags "Generic
# High Entropy Secret" in the test fixtures: every key shape this plugin masks
# (ghp_, sk-ant-, AKIA, ms-, xox-) has a fixture that looks like the real
# thing, because the tests are about exactly those shapes. The fixtures are
# invented from scratch (repeated words, "example" runs, sequence digits), and
# none of them is a credential.
#
# The fixtures that carry key shapes live in the tests; the README and the
# source comments quote shapes as well (ghp_, sk-ant-, AKIA, ms-, xox-), and
# none of those is a credential either — a comment's example is an invented
# run, or a masked one. The test folder is what this config sets aside;
# everything else in the repository, comments included, is scanned as usual.
#
# This file is read by ggshield and the pre-commit hook, not by GitGuardian's
# GitHub App: an App scan of a push ignores it, and its filepath exclusions
# live in the dashboard instead (Settings -> Secrets detection -> Filepath
# exclusions), where a new exclusion also applies to incidents already open.
# The fixtures are low-entropy on purpose so neither scan has a reason to
# fire; keep them that way rather than relying on this file.
version: 2
secret:
  ignored-paths:
    - "test/**"
